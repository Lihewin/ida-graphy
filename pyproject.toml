[project]
name = "ida-graphy"
version = "1.0.0"
description = "Neo4j-based binary analysis and graph extraction tool using IDA Pro"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "neo4j>=5.0",
    "tqdm>=4.0",
]
authors = [
    { name = "IDA-Graphy Team" }
]
keywords = ["binary-analysis", "reverse-engineering", "neo4j", "ida-pro", "graph-database"]

[project.scripts]
ida-graphy = "ida_graphy:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
py-modules = ["ida_graphy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "analyzers*", "exporters*", "database*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
