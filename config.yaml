# IDA-Graphy Configuration File
# =============================================================================

# IDA Installation Settings
ida:
  # Path to IDA Pro installation directory
  path: "C:\\Program Files\\IDA Professional 9.2"
  
  # Path to idalib Python bindings (usually under IDA installation)
  idalib_python: "C:\\Program Files\\IDA Professional 9.2\\idalib\\python"

# Export Settings
export:
  # Enable file export (decompiled code, structures, etc.)
  # Requires Hex-Rays decompiler plugin
  enable_file_export: true

# Analysis Options
analysis:
  # Enable dataflow analysis (READS/WRITES edges)
  enable_dataflow: true

# Neo4j Integration Settings
neo4j:
  # Connection settings for direct database operations
  connection:
    # Neo4j server URI
    uri: "neo4j://127.0.0.1:7687"
    
    # Authentication
    user: "neo4j"
    password: "Njupt@241"
    
    # Connection pool settings
    max_connection_pool_size: 50
    connection_timeout: 30.0
  
  # Project database settings
  projects:
    # Database name prefix for projects
    database_prefix: "idg-project-"
    
    # Whether to automatically create databases for new projects
    auto_create_database: true
    
    # Whether to drop database when deleting project
    drop_database_on_delete: true

# Project Management Settings
projects:
  # Root directory for all projects
  root_dir: "projects"

# Logging Settings
logging:
  # Save logs to file
  file: "ida_graphy.log"
